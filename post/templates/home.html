<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Публикации</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }
        .container {
            display: flex;
        }
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: white;
            padding: 20px;
        }
        .sidebar a {
            display: block;
            padding: 10px;
            color: black;
            text-decoration: none;
        }
        .content {
            flex: 1;
            padding: 30px;
        }
        .posts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .post {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
        .post img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .post a {
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <h2>CATEGORIES</h2>
        <a href="#">Movies</a>
        <a href="#">TV Shows</a>
        <a href="#">Sports</a>
        <a href="#">Musics</a>
        <a href="#">Videogames</a>
    </div>
    <div class="content">
        <h1>Publications</h1>
        <a href="{% url 'create' %}"><button>Create a publication</button></a>
        <br><br>
        <div class="posts">
            {% for post in posts %}
                <div class="post">
                    <a href="{% url 'detail' post.id %}">{% if post.photo %}<img src="{{ post.photo.url }}">{% endif %}<h3>{{ post.title }}</h3></a>
                    <p>{{ post.description|truncatewords:15 }}</p>
                </div>
            {% empty %}
                <p>No publication found</p>
            {% endfor %}
        </div>
    </div>
</div>
</body>
</html>
